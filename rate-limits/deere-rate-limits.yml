specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: John Deere
providerId: deere
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Agriculture
  - AgTech
  - Operations Center
  - Precision Agriculture
  - Rate Limiting
description: John Deere does not publish numeric rate limits for its Operations Center or
  Precision Tech APIs on the public developer portal. Throttling and quota numbers are documented
  inside the gated developer portal after partner registration. In practice, the APIs implement
  per-client and per-organization throttles plus webhook-delivery backpressure, with retries
  expected on 429 / 503 responses.
sources:
  - https://developer.deere.com/
notes: No public numeric limits; documented post-registration. Reconciled false until partner
  portal numbers can be confirmed.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Per-client request rate
    scope: oauth-client
    metric: requests_per_second
    limit: see developer.deere.com partner portal
    notes: Per-client throttle scoped to the OAuth client_id; numbers are partner-portal-only.
  - name: Per-organization request rate
    scope: organization
    metric: requests_per_second
    limit: see developer.deere.com partner portal
    notes: Operations Center organizations carry independent throttles; multi-org integrations
      see compounded ceilings.
  - name: Webhook delivery
    scope: subscription
    metric: events_per_second
    limit: see developer.deere.com partner portal
    notes: Webhook delivery is subject to backpressure when subscriber endpoints fail or slow;
      Deere requeues with exponential delay.
policies:
  - name: Backoff Strategy
    description: Retry on 429/503 with exponential backoff and jitter; honor Retry-After when
      present.
  - name: Webhook Acknowledgement
    description: Subscribers must respond 2xx within Deere's published timeout to keep delivery
      flowing; sustained failures cause subscription suspension.
  - name: Bulk Reads via Pagination
    description: Field, machine, and field-operations enumerations should always paginate; large
      organizations easily exceed default page sizes and saturate per-org throttles.
  - name: Customer Authorization Lifecycle
    description: A customer can revoke partner access at any time; treat 401/403 from previously
      authorized organizations as a permanent revocation, not a transient throttle.
maintainers:
