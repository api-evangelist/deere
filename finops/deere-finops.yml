specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: John Deere
providerId: deere
publisherName: Deere & Company
serviceCategory: Industry Platform
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Agriculture
  - AgTech
  - Operations Center
  - Precision Agriculture
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for John Deere developer APIs: there is no per-API-call invoice
  for the Operations Center / Precision Tech APIs. Cost flows through equipment, telematics
  (JDLink), and Operations Center subscriptions purchased via Deere dealers. Partner integrations
  may incur engineering and support costs but no metered API charge.'
sources:
  - https://developer.deere.com/
  - https://www.deere.com/en/technology-products/precision-ag-technology/
notes: No metered API billing. FinOps shape attributes Deere spend to underlying equipment and
  Operations Center subscriptions, with API integration as a no-fee add-on.
billingModel:
  pricingCategory: Bundled with Equipment / Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: John Deere Operations Center
  ServiceCategory: Industry Platform
  ServiceSubcategory: Precision Agriculture
  ProviderName: John Deere
  PublisherName: Deere & Company
  InvoiceIssuerName: Deere & Company
  PricingCategory: Subscription
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: api_requests
    description: Count of Operations Center API calls. Not directly billed but useful for capacity
      planning and partner reporting.
    unit: request
    aggregation: count
    dimensions:
      - api
      - organization
      - client_id
  - name: webhook_deliveries
    description: Webhook events delivered to partner endpoints.
    unit: event
    aggregation: count
    dimensions:
      - subscription
      - organization
  - name: connected_machines
    description: Count of connected machines under an organization (drives the underlying JDLink
      / Operations Center subscription bill).
    unit: machine
    aggregation: max
    dimensions:
      - machine_type
      - organization
  - name: managed_acres
    description: Acres under management in Operations Center; common pricing dimension for
      precision-ag subscriptions.
    unit: acre
    aggregation: max
    dimensions:
      - organization
      - region
principles:
  - name: Visibility
    description: Use the Operations Center admin console for connected-machine and acreage counts
      and cross-reference dealer invoices for JDLink and Operations Center subscriptions. The
      developer portal exposes request volumes for partner capacity reporting.
  - name: Allocation
    description: Attribute Deere costs to the farming operation or business unit that owns the
      Operations Center organization. Partner integrations should tag OAuth client_ids by
      consuming product or customer.
  - name: Optimization
    description: Page large enumerations efficiently, subscribe to webhooks instead of polling,
      cache slowly-changing field/boundary data locally, and align JDLink subscription tiers with
      actual machine connectivity needs.
  - name: Accountability
    description: Designate a precision-ag lead at the customer who owns the Operations Center
      seat allocation and the partner-integration roster. Review machine-and-acreage counts
      annually before subscription renewal.
maintainers:
