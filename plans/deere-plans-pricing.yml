description: John Deere exposes its Operations Center and Precision Tech APIs through a partner
  developer program at developer.deere.com. The program is access-by-application — partners and
  customers register, get OAuth credentials, and integrate against an authorized Deere Operations
  Center organization. John Deere does not publish a public price list for API access; commercial
  terms are part of the broader Operations Center / partner relationship rather than a per-call
  invoice. Underlying machine connectivity (JDLink, equipment subscriptions) is sold separately
  through dealer channels.
sources:
  - https://developer.deere.com/
notes: No public per-call pricing. Access is partner-program-gated and tied to the customer's
  Deere Operations Center entitlements rather than a stand-alone API SKU.
plans:
  - id: deere-developer-program
    name: Developer Program
    type: freemium
    description: Application-gated access to the Operations Center and Precision Tech APIs.
      Sandbox credentials are issued after registration; production access requires partner
      approval and customer organization authorization via OAuth.
    entries:
      - label: API access
        name: api_access
        type: flat
        metric: month
        limit: see developer.deere.com
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Application-gated access
      - name: OAuth 2.0 authorization
      - name: Sandbox environment
      - name: John Deere Operations Center Organizations API
      - name: John Deere Operations Center Fields API
      - name: John Deere Operations Center Machines API
      - name: John Deere Operations Center Field Operations API
      - name: John Deere Operations Center Products API
      - name: John Deere Operations Center Webhook API
      - name: John Deere Precision Tech APIs
  - id: deere-partner
    name: Partner / Production
    type: enterprise
    description: Commercial partner integration tier for production traffic. Terms negotiated
      under the John Deere Partner Agreement. Access flows through customer-authorized Operations
      Center organizations rather than a per-call price.
    entries:
      - label: Partner access
        name: partner_access
        type: flat
        metric: contract
        limit: see partner agreement
        timeFrame: year
        geo: global
        unit: 1
        price: contact john deere
        userMultiplied: false
    elements:
      - name: Production OAuth credentials
      - name: Partner Agreement
      - name: Customer organization authorization required
      - name: Webhook subscriptions
      - name: All Operations Center APIs
      - name: Precision Tech APIs
