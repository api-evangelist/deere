apis:
  - aid: deere:operations-center-organizations-api
    name: John Deere Operations Center Organizations API
    description: >-
      Provides access to the organizations a John Deere Operations Center user
      belongs to. Organizations are the top-level container for users, fields,
      equipment, and partner relationships in Operations Center.
    humanURL: https://developer.deere.com/dev-docs/organizations
    tags:
      - Operations Center
      - Organization
    tags_raw:
      - Operations Center
      - Organizations
    properties:
      - type: Documentation
        url: https://developer.deere.com/dev-docs/organizations
  - aid: deere:operations-center-fields-api
    name: John Deere Operations Center Fields API
    description: >-
      Exposes growers, farms, fields, and field boundaries in Operations Center
      so that partner applications can sync agronomic field metadata and
      boundary geometry.
    humanURL: https://developer.deere.com/
    tags:
      - Operations Center
      - Fields
      - Boundaries
      - Agronomy
    properties:
      - type: Documentation
        url: https://developer.deere.com/
  - aid: deere:operations-center-machines-api
    name: John Deere Operations Center Machines API
    description: >-
      Provides metadata, telematics, and engine information for connected John
      Deere machines, including machine locations, engine hours, hours of
      operation, alerts, and device state reports.
    humanURL: https://developer.deere.com/
    tags:
      - Operations Center
      - Machines
      - Telematics
      - Equipment
    properties:
      - type: Documentation
        url: https://developer.deere.com/
  - aid: deere:operations-center-field-operations-api
    name: John Deere Operations Center Field Operations API
    description: >-
      Returns information about field operations such as planting, application,
      tillage, and harvest performed by connected John Deere machines, with
      links to machine, field, and product data.
    humanURL: https://developer.deere.com/
    tags:
      - Operations Center
      - Field Operations
      - Planting
      - Harvest
      - Application
    properties:
      - type: Documentation
        url: https://developer.deere.com/
  - aid: deere:operations-center-products-api
    name: John Deere Operations Center Products API
    description: >-
      Manages crop, seed, chemical, and fertilizer products used in field
      operations, allowing applications to read and reconcile product
      catalogs across an organization.
    humanURL: https://developer.deere.com/dev-docs/products
    tags:
      - Operations Center
      - Product
      - Inputs
    tags_raw:
      - Operations Center
      - Products
      - Inputs
    properties:
      - type: Documentation
        url: https://developer.deere.com/dev-docs/products
  - aid: deere:operations-center-webhook-api
    name: John Deere Operations Center Webhook API
    description: >-
      Lets partner applications subscribe to event notifications from
      Operations Center so that changes to organizations, machines, fields,
      and field operations can be received without polling.
    humanURL: https://developer.deere.com/dev-docs/webhook
    tags:
      - Operations Center
      - Webhook
      - Event
    tags_raw:
      - Operations Center
      - Webhooks
      - Events
    properties:
      - type: Documentation
        url: https://developer.deere.com/dev-docs/webhook
  - aid: deere:precision-tech-apis
    name: John Deere Precision Tech APIs
    description: >-
      A suite of APIs supporting precision agriculture workflows including
      prescription maps, work plans, setup files, and equipment configuration
      for connected John Deere machinery.
    humanURL: https://developer.deere.com/precision
    tags:
      - Precision Agriculture
      - Prescriptions
      - Work Plans
      - Setup Files
    properties:
      - type: Documentation
        url: https://developer.deere.com/precision
