description: >-
  John Deere is a manufacturer of agricultural, construction, and forestry
  machinery, equipment, and technology. Through its Operations Center and
  Precision Tech developer programs, John Deere exposes APIs that allow
  authorized partners and customers to access organization, field, machine,
  field operations, and webhook data tied to connected equipment and farm
  management workflows.
